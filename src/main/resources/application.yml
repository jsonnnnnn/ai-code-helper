spring:
  application:
    name: ai-code-helper
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: postgres
    password: a1471354978
    driver-class-name: org.postgresql.Driver

server:
  port: 8081
  servlet:
    context-path: /api

app:
  rag:
    enabled: true
    # 是否强制重建全部索引（pgvector + parent表 + BM25表）
    # 文档首次写入或内容有变更时设为 true ，平时保持 false
    reingest: true
    pgvector:
      table: langchain4j_embeddings
      # text-embedding-v3 默认输出维度为 1024
      dimension: 1024
    retrieval:
      top-child-results: 20       # 向量 / BM25 各自召回的 child 数量
      reranker-candidates: 20     # 送入 cross-encoder 的 parent 候选数
      top-parent-results: 10      # 最终返回给 LLM 的 parent 数量
      min-child-score: 0.3        # 向量相似度过滤阈值
      vector-weight: 0.6          # 联合分中向量权重（BM25 权重 = 1 - 此值）
    cross-encoder:
      model: gte-rerank-v2           # DashScope rerank 模型（gte-rerank / gte-rerank-v2）

langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-plus
        api-key: sk-97a17038ee844b9b92e180b0aa70f6e6
      embedding-model:
        model-name: text-embedding-v3
